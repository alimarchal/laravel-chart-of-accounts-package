      responses:
        '200':
          description: Companies; current marks the one this request runs in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/Company'
                      - type: object
                        properties:
                          current:
                            type: boolean
                  multi_company:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - $ref: '#/components/parameters/Company'
    post:
      tags:
      - Companies
      summary: Create a company
      operationId: create_company
      description: 'The creator gets access to the new company.


        Permission: `companies.manage`.'
      responses:
        '201':
          description: Created company
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - name
              properties:
                code:
                  type: string
                  maxLength: 30
                  pattern: ^[A-Za-z0-9_-]+$
                  description: Stored upper-case; unique.
                name:
                  type: string
                legal_name:
                  type: string
                tax_number:
                  type: string
                registration_number:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                address:
                  type: string
                fiscal_year_start_month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  default: 1
                seed:
                  type: boolean
                  default: true
                  description: Create with the standard chart of accounts, current fiscal year, cost centers and tax codes
                    (create only).
      parameters:
      - $ref: '#/components/parameters/Company'
