        account_name:
          type: string
        account_number:
          type: string
        bank_name:
          type:
          - string
          - 'null'
        branch:
          type:
          - string
          - 'null'
        iban:
          type:
          - string
          - 'null'
        swift_code:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
    Reconciliation:
      type: object
      required:
      - bank_account_id
      - statement_date
      - statement_balance
      - book_balance
      - status
      properties:
        bank_account_id:
          type: integer
        statement_date:
          type: string
          format: date
        statement_balance:
          type: number
        book_balance:
          type: number
        status:
          type: string
          enum:
          - draft
          - completed
          - void
    TaxCode:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
    TaxRate:
      type: object
      required:
      - tax_code_id
      - rate
      - effective_from
      properties:
        tax_code_id:
          type: integer
        rate:
          type: number
          minimum: 0
          maximum: 100
        effective_from:
          type: string
          format: date
          description: Unique per tax code.
        effective_to:
          type:
          - string
          - 'null'
          format: date
        is_active:
          type: boolean
    Company:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: SUB
        name:
          type: string
          example: Subsidiary Ltd
        legal_name:
          type:
          - string
          - 'null'
        tax_number:
          type:
          - string
          - 'null'
          description: e.g. NTN
        registration_number:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        address:
