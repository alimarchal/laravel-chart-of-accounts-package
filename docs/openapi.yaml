        description: 'Codes or ids; default: every company you can access.'
      - name: date_from
        in: query
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        schema:
          type: string
          format: date
      - name: as_of_date
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Company'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    Company:
      name: X-Company
      in: header
      schema:
        type: string
      description: 'Company code or id (multi-company). Default: your default company. 403 if you have no access, 404 if unknown.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 100
      description: Same key + same body → original entry is returned (200). Same key + different body → 422.
  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The user lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Validation failed or an accounting rule was violated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    Money:
      type: string
      pattern: ^-?\d+\.\d{2}$
      example: '1500.00'
      description: Decimal amount as a string with two decimals (exact, no floating point).
    Error:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
    PaginationEnvelope:
      type: object
      properties:
        links:
          type: object
          properties:
            first:
              type:
              - string
              - 'null'
            last:
              type:
              - string
              - 'null'
            prev:
              type:
              - string
              - 'null'
            next:
              type:
              - string
              - 'null'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
            from:
              type:
              - integer
              - 'null'
            to:
              type:
              - integer
              - 'null'
    Account:
      type: object
      properties:
        id:
          type: integer
        account_code:
          type: string
          example: '1101'
        account_name:
          type: string
          example: Cash In Hand
        normal_balance:
          type: string
          enum:
          - debit
          - credit
        is_group:
          type: boolean
        is_active:
          type: boolean
        is_system:
          type: boolean
        parent_id:
          type:
          - integer
          - 'null'
        account_type_id:
          type: integer
        currency_id:
          type: integer
        description:
          type:
          - string
          - 'null'
        account_type:
          type: object
        currency:
          type: object
        children:
          type: array
          items:
            $ref: '#/components/schemas/Account'
          description: Only in /chart-of-accounts/tree
    AccountInput:
      type: object
      required:
      - account_type_id
      - currency_id
      - account_code
      - account_name
      properties:
        parent_id:
          type:
          - integer
          - 'null'
          description: Must be a group account of the same account type; no cycles.
        account_type_id:
          type: integer
        currency_id:
          type: integer
        account_code:
          type: string
          maxLength: 30
          description: Unique. Locked once the account has journal lines.
        account_name:
          type: string
          maxLength: 255
        normal_balance:
          type: string
          enum:
          - debit
          - credit
          description: Defaults to the account type's normal balance.
        description:
          type:
          - string
          - 'null'
        is_group:
          type: boolean
          default: false
          description: Omitted on update = unchanged.
        is_active:
          type: boolean
          default: true
          description: Omitted on update = unchanged.
    AccountBalance:
      type: object
      properties:
        account_id:
          type: integer
        account_code:
          type: string
        account_name:
          type: string
        normal_balance:
          type: string
        includes_child_accounts:
          type: boolean
        as_of_date:
          type: string
          format: date
        total_debit:
          $ref: '#/components/schemas/Money'
        total_credit:
          $ref: '#/components/schemas/Money'
        balance:
          $ref: '#/components/schemas/Money'
    JournalLine:
      type: object
      properties:
        id:
          type: integer
        line_no:
          type: integer
        chart_of_account_id:
          type: integer
        account_code:
          type: string
        account_name:
          type: string
        cost_center_id:
          type:
          - integer
          - 'null'
        cost_center_code:
          type:
          - string
          - 'null'
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
        description:
          type:
          - string
          - 'null'
        reconciliation_status:
          type:
          - string
          - 'null'
    JournalEntry:
      type: object
      properties:
        id:
          type: integer
        entry_date:
          type: string
          format: date
        reference:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - draft
          - posted
          - void
        currency_id:
          type: integer
        fx_rate_to_base:
          type: string
        accounting_period_id:
          type:
          - integer
          - 'null'
        posted_at:
          type:
          - string
          - 'null'
          format: date-time
        approval:
          type: object
          properties:
            required:
              type:
              - boolean
              - 'null'
              description: Whether posting needs approval (drafts with lines loaded)
            status:
              type:
              - string
              - 'null'
              enum:
              - pending
              - approved
              - rejected
              - null
            submitted_at:
              type:
              - string
              - 'null'
              format: date-time
            submitted_by:
              type:
              - integer
              - 'null'
            approved_at:
              type:
              - string
              - 'null'
              format: date-time
            approved_by:
              type:
              - integer
              - 'null'
            rejected_at:
              type:
              - string
              - 'null'
              format: date-time
            rejected_by:
              type:
              - integer
              - 'null'
            rejection_reason:
              type:
              - string
              - 'null'
        created_by:
          type:
          - integer
          - 'null'
        posted_by:
          type:
          - integer
          - 'null'
        is_reversed:
          type: boolean
        reversed_by_entry_id:
          type:
          - integer
          - 'null'
        reverses_entry_id:
          type:
          - integer
          - 'null'
        total_debit:
          $ref: '#/components/schemas/Money'
        total_credit:
          $ref: '#/components/schemas/Money'
        currency:
          type: object
        accounting_period:
          type:
          - object
          - 'null'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
        created_at:
          type: string
          format: date-time
    JournalLineInput:
      type: object
      description: Give either chart_of_account_id or account_code; either debit or credit must be > 0.
      properties:
        id:
          type: integer
          description: Existing line id (updates only); omitted lines are deleted.
        chart_of_account_id:
          type: integer
        account_code:
          type: string
          example: '1101'
        cost_center_id:
          type:
          - integer
          - 'null'
        cost_center_code:
          type:
          - string
          - 'null'
          example: ADMIN
        debit:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 1500
        credit:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 0
        description:
          type:
          - string
          - 'null'
          maxLength: 255
    JournalEntryInput:
      type: object
      required:
      - entry_date
      - lines
      properties:
        entry_date:
          type: string
          format: date
        currency_id:
          type:
          - integer
          - 'null'
        currency_code:
          type:
          - string
          - 'null'
          example: PKR
          description: Alternative to currency_id. Defaults to the base currency.
        fx_rate_to_base:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          default: 1
        reference:
          type:
          - string
          - 'null'
          maxLength: 255
        description:
          type:
          - string
          - 'null'
        auto_post:
          type: boolean
          default: false
          description: Post immediately; requires `journal-entries.post`. Rejected (422) when maker-checker requires approval.
        lines:
          type: array
          minItems: 2
          maxItems: 500
          items:
            $ref: '#/components/schemas/JournalLineInput'
      example:
        entry_date: '2026-10-04'
        reference: INV-1001
        auto_post: true
        lines:
        - account_code: '1103'
          debit: 1500
          credit: 0
        - account_code: '4101'
          debit: 0
          credit: 1500
    SimpleEntryInput:
      type: object
      required:
      - debit_account_code
      - credit_account_code
      - amount
      properties:
        debit_account_code:
          type: string
          example: '5102'
        credit_account_code:
          type: string
          example: '1101'
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 2500
        entry_date:
          type:
          - string
          - 'null'
          format: date
        description:
          type:
          - string
          - 'null'
          example: Office rent
        reference:
          type:
          - string
          - 'null'
        post:
          type: boolean
          default: true
          description: Requires `journal-entries.post` when true.
    Period:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum:
          - open
          - closed
          - archived
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
        closing_total_debits:
          type:
          - string
          - 'null'
        closing_total_credits:
          type:
          - string
          - 'null'
        closing_net_income:
          type:
          - string
          - 'null'
        closing_journal_entry_id:
          type:
          - integer
          - 'null'
    ReportRows:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        totals:
          type: object
    LedgerPage:
      type: object
      description: Laravel paginator (data, current_page, per_page, total, …) plus totals.
      properties:
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        totals:
          type: object
          properties:
            total_debit:
              type: number
            total_credit:
              type: number
            closing_balance:
              type: number
    CashFlowPage:
      type: object
      description: Laravel paginator of cash/bank lines (cash_in, cash_out, net_cash_flow) plus totals for the whole period.
      properties:
        data:
          type: array
          items:
            type: object
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        totals:
          type: object
          properties:
            cash_in:
              type: string
            cash_out:
              type: string
            net_cash_flow:
              type: string
    StatementPage:
      type: object
      description: Laravel paginator of posted lines, each with running_balance (base currency, on the account's normal side),
        plus opening balance and totals.
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              entry_date:
                type: string
              journal_entry_id:
                type: integer
              reference:
                type:
                - string
                - 'null'
              base_debit:
                type: string
              base_credit:
                type: string
              running_balance:
                type: string
                example: '1250.00'
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        account:
          type: object
          properties:
            id:
              type: integer
            account_code:
              type: string
            account_name:
              type: string
            normal_balance:
              type: string
        opening_balance:
          type: string
          example: '1000.00'
        totals:
          type: object
          properties:
            debit:
              type: string
            credit:
              type: string
            closing_balance:
              type: string
    Health:
      type: object
      properties:
        ok:
          type: boolean
        missing_tables:
          type: array
          items:
            type: string
        base_currency_count:
          type: integer
        account_type_count:
          type: integer
        chart_of_account_count:
          type: integer
    AccountType:
      type: object
      required:
      - code
      - name
      - normal_balance
      - report_group
      properties:
        code:
          type: string
          maxLength: 20
          example: ASSET
        name:
          type: string
          example: Asset
        normal_balance:
          type: string
          enum:
          - debit
          - credit
        report_group:
          type: string
          enum:
          - BalanceSheet
          - IncomeStatement
        description:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
    Currency:
      type: object
      required:
      - code
      - name
      - exchange_rate_to_base
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
        name:
          type: string
        symbol:
          type:
          - string
          - 'null'
        exchange_rate_to_base:
          type: number
          exclusiveMinimum: 0
        is_base:
          type: boolean
          description: Exactly one base currency; cannot change once entries are posted.
        is_active:
          type: boolean
    PeriodInput:
      type: object
      required:
      - name
      - start_date
      - end_date
      properties:
        name:
          type: string
          example: FY 2027
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum:
          - open
          - closed
          - archived
          description: Changing it runs close (`periods.close`) / reopen (`periods.reopen`).
    CostCenter:
      type: object
      required:
      - code
      - name
      - type
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - cost_center
          - project
        description:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
    BankAccount:
      type: object
      required:
      - account_name
      - account_number
      properties:
        chart_of_account_id:
          type:
          - integer
          - 'null'
