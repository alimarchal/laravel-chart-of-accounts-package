openapi: 3.1.0
info:
  title: Laravel Chart of Accounts API
  version: 2.22.0
  description: 'Double-entry accounting REST API for `alimarchal/laravel-chart-of-accounts`.


    * **Auth:** `Authorization: Bearer <Sanctum token>` (configurable with `ACCOUNTING_API_MIDDLEWARE`).

    * **Permissions:** every endpoint requires a Spatie permission (listed per operation).

    * **Rate limit:** `ACCOUNTING_API_RATE_LIMIT` requests/minute per user (default 120) → 429.

    * **Pagination:** `?page=` and `?per_page=` (max `ACCOUNTING_API_MAX_PER_PAGE`, default 100).

    * **Errors:** 422 with `message` (accounting rules) and `errors` (validation).

    * **Money:** amounts are returned as decimal strings with two decimals.

    * **Retries:** send `Idempotency-Key` when creating journal entries.

    * **Companies:** with multi-company enabled, send `X-Company: <code or id>`; records of other companies are never visible
    (404).

    * **Maker-checker:** with approvals enabled, entries at/above the threshold go submit → approve (a different user) → posted.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: '{host}/api/v1/accounting'
  variables:
    host:
      default: http://localhost:8000
security:
- bearerAuth: []
tags:
- name: Journal entries
  description: Create, post, reverse and void double-entry journal entries.
- name: Chart of accounts
  description: Hierarchical accounts, the account tree and account balances.
- name: Reports
  description: Financial statements and ledgers (posted entries only).
- name: Periods
  description: Accounting periods, closing and balance snapshots.
- name: Account types
  description: Asset, liability, equity, income and expense types.
- name: Currencies
  description: Currencies and exchange rates (exactly one base currency).
- name: Cost centers
  description: Cost centers and projects for line-level analysis.
- name: Bank accounts
  description: Bank accounts linked to GL accounts.
- name: Reconciliations
  description: Bank statement reconciliations.
- name: Tax
  description: Tax codes and dated tax rates.
- name: Recurring entries
  description: 'Journal entries that repeat on a schedule: templates, runs, pause and resume.'
- name: Voucher types
  description: Voucher types (JV, CPV, CRV, BPV, BRV, …) and their gapless number series.
- name: Companies
  description: Companies (multi-company), access and consolidation.
- name: Users & roles
  description: Users, roles and permissions — privilege-checked and audited.
- name: System
  description: Installation health.
