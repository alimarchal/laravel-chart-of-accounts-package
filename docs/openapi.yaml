      tags:
      - Chart of accounts
      summary: Import accounts from CSV or Excel (multipart/form-data)
      operationId: import_chart
      description: 'Fields: `file` (.csv/.xlsx, max `ACCOUNTING_CHART_IMPORT_MAX_KB`), `mode` (`upsert` updates existing codes
        — default; `create` leaves them unchanged) and `dry_run` (preview, nothing saved). Parents may appear anywhere in
        the file. Every row passes the same rules as the API and the database guards; if any row is in error nothing is imported
        (422 with the rows).


        Permission: `chart-of-accounts.import`.'
      responses:
        '200':
          description: Preview (dry_run) or nothing to change
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChartImportResult'
                required:
                - data
        '201':
          description: Imported
