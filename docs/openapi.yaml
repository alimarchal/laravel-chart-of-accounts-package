                    $ref: '#/components/schemas/PartyDocument'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - $ref: '#/components/parameters/Company'
  /party-documents/{id}/void:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Receivables & payables
      summary: Void a posted document (its entry is reversed)
      operationId: void_party_document
      description: '422 while payments or credits are applied to it.


        Permission: `party-documents.void`.'
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartyDocument'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - $ref: '#/components/parameters/Company'
  /party-documents/{id}/apply:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Receivables & payables
      summary: Apply a credit or debit note to invoices or bills
      operationId: apply_credit_note
      description: 'Permission: `party-payments.create`.'
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartyDocument'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - allocations
              properties:
                allocations:
                  type: array
                  items:
                    type: object
                    required:
                    - document_id
                    - amount
                    properties:
                      document_id:
                        type: integer
                      amount:
                        type: number
      parameters:
      - $ref: '#/components/parameters/Company'
  /party-allocations/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    delete:
      tags:
      - Receivables & payables
      summary: Undo an allocation
      operationId: undo_allocation
      description: 'Permission: `party-payments.create`.'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/Company'
  /party-payments:
    get:
      tags:
      - Receivables & payables
      summary: Receipts and payments
      operationId: list_party_payments
      description: 'Permission: `party-payments.view`.'
      responses:
        '200':
          description: Payments, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartyPayment'
                required:
                - data
      parameters:
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - receipt
          - payment
      - name: party_id
        in: query
        schema:
          type: integer
      - $ref: '#/components/parameters/Company'
    post:
      tags:
      - Receivables & payables
      summary: Record a receipt from a customer or a payment to a supplier
      operationId: create_party_payment
      description: 'Posted at once and numbered (RCT-… / PAY-…): the bank account against the party''s control account. What
        is not allocated stays on the party''s account.


        Permission: `party-payments.create`.'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartyPayment'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - party_id
              - kind
              - payment_date
              - amount
              - account_id
              properties:
                party_id:
                  type: integer
                kind:
                  type: string
                  enum:
                  - receipt
                  - payment
                payment_date:
                  type: string
                  format: date
                amount:
                  type: number
                account_id:
                  type: integer
                  description: The bank or cash account
                method:
                  type: string
                reference:
                  type: string
                notes:
                  type: string
                allocations:
                  type: array
                  items:
                    type: object
                    required:
                    - document_id
                    - amount
                    properties:
                      document_id:
                        type: integer
                      amount:
                        type: number
                auto_allocate:
                  type: boolean
                  description: Settle the oldest invoices (bills) first, as far as the amount goes
      parameters:
      - $ref: '#/components/parameters/Company'
  /party-payments/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Receivables & payables
      summary: A payment with its allocations
      operationId: show_party_payment
      description: 'Permission: `party-payments.view`.'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartyPayment'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/Company'
  /party-payments/{id}/allocate:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Receivables & payables
      summary: Allocate (more of) a payment to documents
      operationId: allocate_party_payment
      description: 'Permission: `party-payments.create`.'
      responses:
        '200':
          description: Allocated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartyPayment'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allocations:
                  type: array
                  items:
                    type: object
                    required:
                    - document_id
                    - amount
                    properties:
                      document_id:
                        type: integer
                      amount:
                        type: number
                auto_allocate:
                  type: boolean
      parameters:
      - $ref: '#/components/parameters/Company'
  /party-payments/{id}/void:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Receivables & payables
      summary: Void a payment (entry reversed, allocations released)
      operationId: void_party_payment
      description: 'Permission: `party-payments.void`.'
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartyPayment'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - $ref: '#/components/parameters/Company'
  /receivables/aging:
    get:
      tags:
      - Receivables & payables
      summary: Ageing by customer or supplier, checked against the control account
      operationId: party_aging
      description: 'Permission: `party-documents.view`.'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      as_of:
                        type: string
                        format: date
                      side:
                        type: string
                      rows:
                        type: array
                        items:
                          type: object
                          description: not_due, days_1_30, days_31_60, days_61_90, over_90 (by days past due), unapplied (negative),
                            total
                      totals:
                        type: object
                      reconciliation:
                        type: object
                        properties:
                          ledger:
                            $ref: '#/components/schemas/Money'
                          subledger:
                            $ref: '#/components/schemas/Money'
                          difference:
                            $ref: '#/components/schemas/Money'
                required:
                - data
      parameters:
      - name: side
        in: query
        schema:
          type: string
          enum:
          - receivable
          - payable
        description: 'receivable: what customers owe; payable: what is owed to suppliers (default: by the party''s type)'
      - name: as_of
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Company'
  /receivables/aging/export/{format}:
    parameters:
    - name: format
      in: path
      required: true
      schema:
        type: string
        enum:
        - csv
        - xlsx
        - pdf
    get:
      tags:
      - Receivables & payables
      summary: Export the ageing
      operationId: export_party_aging
      description: 'Permission: `party-documents.view`.'
      responses:
        '200':
          description: The file
      parameters:
      - name: side
        in: query
        schema:
          type: string
          enum:
          - receivable
          - payable
        description: 'receivable: what customers owe; payable: what is owed to suppliers (default: by the party''s type)'
      - name: as_of
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Company'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    Company:
      name: X-Company
      in: header
      schema:
        type: string
      description: 'Company code or id (multi-company). Default: your default company. 403 if you have no access, 404 if unknown.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 100
      description: Same key + same body → original entry is returned (200). Same key + different body → 422.
  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The user lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Validation failed or an accounting rule was violated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    Money:
      type: string
      pattern: ^-?\d+\.\d{2}$
      example: '1500.00'
      description: Decimal amount as a string with two decimals (exact, no floating point).
    Error:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
    PaginationEnvelope:
      type: object
      properties:
        links:
          type: object
          properties:
            first:
              type:
              - string
              - 'null'
            last:
              type:
              - string
              - 'null'
            prev:
              type:
              - string
              - 'null'
            next:
              type:
              - string
              - 'null'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
            from:
              type:
              - integer
              - 'null'
            to:
              type:
              - integer
              - 'null'
    Account:
      type: object
      properties:
        id:
          type: integer
        account_code:
          type: string
          example: '1101'
        account_name:
          type: string
          example: Cash In Hand
        normal_balance:
          type: string
          enum:
          - debit
          - credit
        is_group:
          type: boolean
        is_active:
          type: boolean
        is_system:
          type: boolean
        control_type:
          type:
          - string
          - 'null'
          enum:
          - receivables
          - payables
          - inventory
          - fixed_assets
          - payroll
          - tax
          - null
          description: 'Set when the account controls a sub-ledger: only that module posts to it.'
        parent_id:
          type:
          - integer
          - 'null'
        account_type_id:
          type: integer
        currency_id:
          type: integer
        description:
          type:
          - string
          - 'null'
        account_type:
          type: object
        currency:
          type: object
        children:
          type: array
          items:
            $ref: '#/components/schemas/Account'
          description: Only in /chart-of-accounts/tree
    AccountInput:
      type: object
      required:
      - account_type_id
      - currency_id
      - account_code
      - account_name
      properties:
        parent_id:
          type:
          - integer
          - 'null'
          description: Must be a group account of the same account type; no cycles.
        account_type_id:
          type: integer
        currency_id:
          type: integer
        account_code:
          type: string
          maxLength: 30
          description: Unique. Locked once the account has journal lines.
        account_name:
          type: string
          maxLength: 255
        normal_balance:
          type: string
          enum:
          - debit
          - credit
          description: Defaults to the account type's normal balance.
        description:
          type:
          - string
          - 'null'
        is_group:
          type: boolean
          default: false
          description: Omitted on update = unchanged.
        is_active:
          type: boolean
          default: true
          description: Omitted on update = unchanged.
        control_type:
          type:
          - string
          - 'null'
          description: Requires `control-accounts.manage`; posting accounts only. Omitted = unchanged.
    AccountBalance:
      type: object
      properties:
        account_id:
          type: integer
        account_code:
          type: string
        account_name:
          type: string
        normal_balance:
          type: string
        includes_child_accounts:
          type: boolean
        as_of_date:
          type: string
          format: date
        total_debit:
          $ref: '#/components/schemas/Money'
        total_credit:
          $ref: '#/components/schemas/Money'
        balance:
          $ref: '#/components/schemas/Money'
    JournalLine:
      type: object
      properties:
        id:
          type: integer
        line_no:
          type: integer
        chart_of_account_id:
          type: integer
        account_code:
          type: string
        account_name:
          type: string
        cost_center_id:
          type:
          - integer
          - 'null'
        cost_center_code:
          type:
          - string
          - 'null'
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
        description:
          type:
          - string
          - 'null'
        reconciliation_status:
          type:
          - string
          - 'null'
    JournalEntry:
      type: object
      properties:
        id:
          type: integer
        voucher_number:
          type:
          - string
          - 'null'
          example: JV-2026-00012
          description: Issued when the entry is posted (gapless per voucher type); null for drafts. Never changes afterwards.
        voucher_type_id:
          type:
          - integer
          - 'null'
        voucher_type:
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
            code:
              type: string
              example: JV
            name:
              type: string
        entry_date:
          type: string
          format: date
        reference:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        source_document:
          type:
          - object
          - 'null'
          description: The document the entry records; null when none.
          properties:
            type:
              type:
              - string
              - 'null'
            type_label:
              type:
              - string
              - 'null'
              example: Purchase bill
            number:
              type:
              - string
              - 'null'
            date:
              type:
              - string
              - 'null'
              format: date
            sourceable_type:
              type:
              - string
              - 'null'
              description: Application model the entry was recorded for (set from PHP code).
            sourceable_id:
              type:
              - integer
              - 'null'
        status:
          type: string
          enum:
          - draft
          - posted
          - void
        currency_id:
          type: integer
        fx_rate_to_base:
          type: string
        accounting_period_id:
          type:
          - integer
          - 'null'
        posted_at:
          type:
          - string
          - 'null'
          format: date-time
        approval:
          type: object
          properties:
            required:
              type:
              - boolean
              - 'null'
              description: Whether posting needs approval (drafts with lines loaded)
            status:
              type:
              - string
              - 'null'
              enum:
              - pending
              - approved
              - rejected
              - null
            submitted_at:
              type:
              - string
              - 'null'
              format: date-time
            submitted_by:
              type:
              - integer
              - 'null'
            approved_at:
              type:
              - string
              - 'null'
              format: date-time
            approved_by:
              type:
              - integer
              - 'null'
            rejected_at:
              type:
              - string
              - 'null'
              format: date-time
            rejected_by:
              type:
              - integer
              - 'null'
            rejection_reason:
              type:
              - string
              - 'null'
        created_by:
          type:
          - integer
          - 'null'
        posted_by:
          type:
          - integer
          - 'null'
        is_reversed:
          type: boolean
        reversed_by_entry_id:
          type:
          - integer
          - 'null'
        reverses_entry_id:
          type:
          - integer
          - 'null'
        total_debit:
          $ref: '#/components/schemas/Money'
        total_credit:
          $ref: '#/components/schemas/Money'
        currency:
          type: object
        accounting_period:
          type:
          - object
          - 'null'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
        created_at:
          type: string
          format: date-time
    JournalLineInput:
      type: object
      description: Give either chart_of_account_id or account_code; either debit or credit must be > 0.
      properties:
        id:
          type: integer
          description: Existing line id (updates only); omitted lines are deleted.
        chart_of_account_id:
          type: integer
        account_code:
          type: string
          example: '1101'
        cost_center_id:
          type:
          - integer
          - 'null'
        cost_center_code:
          type:
          - string
          - 'null'
          example: ADMIN
        debit:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 1500
        credit:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 0
        description:
          type:
          - string
          - 'null'
          maxLength: 255
    JournalEntryInput:
      type: object
      required:
      - entry_date
      - lines
      properties:
        voucher_type_id:
          type:
          - integer
          - 'null'
          description: An active voucher type; default JV.
        voucher_type_code:
          type:
          - string
          - 'null'
          example: CPV
          description: Alternative to voucher_type_id.
        source_document_type:
          type:
          - string
          - 'null'
          enum:
          - invoice
          - credit_note
          - bill
          - debit_note
          - receipt
          - payment
          - expense_claim
          - payroll
          - bank_statement
          - contract
          - other
          - null
          description: Keys of config('accounting.source_documents.types'); required with source_document_number.
        source_document_number:
          type:
          - string
          - 'null'
          maxLength: 100
          example: BILL-778
          description: A document (type + number, case-insensitive) can be posted only once per company until its entry is
            reversed (422 otherwise).
        source_document_date:
          type:
          - string
          - 'null'
          format: date
        entry_date:
          type: string
          format: date
        currency_id:
          type:
          - integer
          - 'null'
        currency_code:
          type:
          - string
          - 'null'
          example: PKR
          description: Alternative to currency_id. Defaults to the base currency.
        fx_rate_to_base:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          default: 1
        reference:
          type:
          - string
          - 'null'
          maxLength: 255
        description:
          type:
          - string
          - 'null'
        auto_post:
          type: boolean
          default: false
          description: Post immediately; requires `journal-entries.post`. Rejected (422) when maker-checker requires approval.
        lines:
          type: array
          minItems: 2
          maxItems: 500
          items:
            $ref: '#/components/schemas/JournalLineInput'
      example:
        entry_date: '2026-10-04'
        reference: INV-1001
        auto_post: true
        lines:
        - account_code: '1103'
          debit: 1500
          credit: 0
        - account_code: '4101'
          debit: 0
          credit: 1500
    SimpleEntryInput:
      type: object
      required:
      - debit_account_code
      - credit_account_code
      - amount
      properties:
        debit_account_code:
          type: string
          example: '5102'
        credit_account_code:
          type: string
          example: '1101'
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 2500
        entry_date:
          type:
          - string
          - 'null'
          format: date
        description:
          type:
          - string
          - 'null'
          example: Office rent
        reference:
          type:
          - string
          - 'null'
        source_document_type:
          type:
          - string
